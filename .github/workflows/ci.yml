name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when new commits land on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- --deny warnings

      - name: Test
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release

  postgres:
    name: Test against Postgres
    runs-on: ubuntu-latest
    # The app supports SQLite and Postgres through sqlx's Any driver. The unit
    # tests cover the SQL we generate for each; this job proves the Postgres
    # half actually runs against a real server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: learnswap
          POSTGRES_PASSWORD: learnswap
          POSTGRES_DB: learnswap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Every test shares the one database, so they cannot run in parallel.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://learnswap:learnswap@localhost:5432/learnswap_test
          # Makes a missing/renamed TEST_DATABASE_URL fail this job loudly
          # rather than silently falling back to SQLite.
          REQUIRE_POSTGRES: "1"
        run: cargo test --test routes -- --test-threads=1

  css:
    name: Tailwind build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build stylesheet
        run: ./scripts/tailwind.sh

      # A stylesheet that built but produced almost nothing usually means the
      # @source globs in assets/css/input.css stopped matching the templates.
      - name: Check the stylesheet is not empty
        run: |
          size=$(wc -c < assets/css/app.css)
          echo "app.css is ${size} bytes"
          test "$size" -gt 1000
