<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnSwap</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts: Poppins --> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100">

    <!-- Navigation Bar -->
    <nav class="bg-[#142443] shadow-lg px-8 py-5 flex justify-between items-center">

        <!-- LearnSwap Logo -->
        <h1 class="text-3xl font-black tracking-tight">
            <span class="text-[#FFFFFF]">Learn</span><span class="text-[#60A5FA]">Swap</span>
        </h1>

        <!-- Navigation Links -->
        <div class="flex gap-8 items-center">

            <a href="#" class="text-white hover:text-[#60A5FA] transition-colors">
                Home
            </a>

            <a href="#" class="text-white hover:text-[#60A5FA] transition-colors">
                About
            </a>

            <a href="#" class="text-white hover:text-[#60A5FA] transition-colors">
                Login
            </a>

            <a href="#" class="bg-[#3B82F6] text-white px-6 py-2 rounded-lg hover:bg-[#2563EB] transition-colors">
                Sign Up
            </a>

        </div>

    </nav>

    <!-- Hero Section -->
    <section class="bg-[#F8FAFF] min-h-[500px] flex items-center px-8 md:px-16 lg:px-24 py-20">

    <div class="max-w-3xl">

        <!-- Small Label -->
        <div class="inline-block bg-[#E3EEFF] text-[#3B82F6] text-sm font-semibold px-4 py-2 rounded-full mb-6">
            Share &nbsp;•&nbsp; Learn &nbsp;•&nbsp; Grow Together
        </div>

        <!-- Main Heading -->
        <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight text-[#142443]">

            Exchange Knowledge,<br>

            <span class="text-[#3B82F6]">Empower</span>
            Each Other

        </h1>

        <!-- Description -->
        <p class="mt-6 text-lg text-[#64748B] leading-relaxed max-w-2xl">

            LearnSwap is a student-driven platform where you can share
            and access study materials, notes, and resources to help
            everyone succeed.

        </p>

        <!-- Buttons -->
        <div class="flex flex-wrap gap-4 mt-8">

            <!-- Get Started -->
            <a href="#"
               class="bg-[#3B82F6] text-white font-semibold px-8 py-3 rounded-lg hover:bg-[#2563EB] transition-all duration-200 shadow-sm">

                Get Started &rarr;

            </a>

            <!-- Learn More -->
            <a href="#"
               class="bg-transparent border border-[#CBD5E1] text-[#142443] font-semibold px-8 py-3 rounded-lg hover:bg-[#E3EEFF] transition-all duration-200">

                Learn More

            </a>

        </div>

    </div>

</section>
</body>
</html>
