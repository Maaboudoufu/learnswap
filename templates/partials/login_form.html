{# Its own partial so a failed login can swap just this block. #}
<form
  id="login-form"
  action="/login"
  method="post"
  hx-post="/login"
  hx-target="#login-form"
  hx-swap="outerHTML"
  class="mt-6 space-y-5 rounded-xl border border-slate-200 bg-white p-6"
>
  {% if errors %}
    <div class="rounded-lg border border-rose-200 bg-rose-50 p-4">
      <ul class="list-inside list-disc space-y-1 text-sm text-rose-800">
        {% for error in errors %}<li>{{ error }}</li>{% endfor %}
      </ul>
    </div>
  {% endif %}

  <div>
    <label for="email" class="block text-sm font-medium text-slate-900">Email</label>
    <input type="email" id="email" name="email" value="{{ form.email }}" required autocomplete="email"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
  </div>

  <div>
    <label for="password" class="block text-sm font-medium text-slate-900">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
  </div>

  <button type="submit" class="rounded-lg bg-indigo-600 px-5 py-3 text-sm font-semibold text-white hover:bg-indigo-700">
    Log in
  </button>

  <p class="text-sm text-slate-600">
    No account yet?
    <a href="/register" class="font-medium text-indigo-600 hover:underline">Join LearnSwap</a>.
  </p>
</form>
