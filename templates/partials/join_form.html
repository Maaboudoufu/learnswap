{# The form is its own partial so a failed submission can swap just this block. #}
<form
  id="join-form"
  action="/join"
  method="post"
  hx-post="/join"
  hx-target="#join-form"
  hx-swap="outerHTML"
  class="mt-6 space-y-5 rounded-xl border border-slate-200 bg-white p-6"
>
  {% if errors %}
    <div class="rounded-lg border border-rose-200 bg-rose-50 p-4">
      <p class="text-sm font-semibold text-rose-900">Almost &mdash; fix these first:</p>
      <ul class="mt-2 list-inside list-disc space-y-1 text-sm text-rose-800">
        {% for error in errors %}<li>{{ error }}</li>{% endfor %}
      </ul>
    </div>
  {% endif %}

  <div>
    <label for="name" class="block text-sm font-medium text-slate-900">Name</label>
    <input type="text" id="name" name="name" value="{{ form.name }}" required
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
  </div>

  <div>
    <label for="headline" class="block text-sm font-medium text-slate-900">
      Headline <span class="font-normal text-slate-500">(optional)</span>
    </label>
    <input type="text" id="headline" name="headline" value="{{ form.headline }}"
      placeholder="CS junior, weekend ceramicist"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
  </div>

  <div>
    <label for="teaching" class="block text-sm font-medium text-slate-900">Skills you can teach</label>
    <input type="text" id="teaching" name="teaching" value="{{ form.teaching }}"
      placeholder="Rust, Data Structures, Pottery"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
    <p class="mt-1 text-xs text-slate-500">Separate skills with commas.</p>
  </div>

  <div>
    <label for="learning" class="block text-sm font-medium text-slate-900">Skills you want to learn</label>
    <input type="text" id="learning" name="learning" value="{{ form.learning }}"
      placeholder="Spanish, Guitar"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
    <p class="mt-1 text-xs text-slate-500">Separate skills with commas.</p>
  </div>

  <div>
    <label for="bio" class="block text-sm font-medium text-slate-900">
      About you <span class="font-normal text-slate-500">(optional)</span>
    </label>
    <textarea id="bio" name="bio" rows="3"
      class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">{{ form.bio }}</textarea>
  </div>

  <button type="submit" class="rounded-lg bg-indigo-600 px-5 py-3 text-sm font-semibold text-white hover:bg-indigo-700">
    Create my profile
  </button>
</form>
